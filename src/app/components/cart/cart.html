<div class="cart-container">
  <h2>Shopping Cart</h2>


  <div class="empty" *ngIf="cartItems.length === 0">
    <p>Your cart is empty.</p>
  </div>

  <div class="cart-content" *ngIf="cartItems.length > 0">
    <table class="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of cartItems">
          <td class="product-info">
            <img [src]="item.imageUrl" alt="{{ item.name }}" />
            <span>{{ item.name }}</span>
          </td>
          <td>₱{{ item.price | number:'1.0-2' }}</td>
          <td>
            <div class="quantity-controls">
              <button (click)="decreaseQuantity(item)">−</button>
              <input type="number" [(ngModel)]="item.quantity" (change)="updateTotal()" min="1" />
              <button (click)="increaseQuantity(item)">+</button>
            </div>
          </td>
          <td>₱{{ item.price * item.quantity }}</td>
          <td>
            <button class="remove-btn" (click)="removeFromCart(item)">Remove</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <p><span>Items:</span> {{ totalItems }}</p>
      <p><span>Subtotal:</span> ₱{{ subtotal | number:'1.0-2' }}</p>

      <hr />
      <p class="total"><strong>Total:</strong> ₱{{ subtotal | number:'1.0-2' }}</p>
      <button class="checkout-btn">Place Order</button>
    </div>
  </div>
  <div class="backtoshop">
    <button class="back-btn" (click)="backCart()">Back to Shop</button>
  </div>
</div>
