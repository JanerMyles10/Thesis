<div class="settings-container">
  <h2>Shop Settings</h2>

  <div class="settings-grid">
    
    <!-- LEFT: Shop Details Form -->
    <div class="card form-card">
      <h3>General Information</h3>
      <form (ngSubmit)="saveSettings()">
        
        <div class="form-group">
          <label>Shop Name</label>
          <input type="text" [(ngModel)]="shop.shopName" name="shopName" class="form-control">
        </div>

        <div class="form-group">
          <label>Tagline</label>
          <input type="text" [(ngModel)]="shop.shopTagline" name="shopTagline" class="form-control" placeholder="e.g. Handmade with love">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea rows="4" [(ngModel)]="shop.shopDescription" name="shopDescription" class="form-control"></textarea>
        </div>

        <div class="form-row">
           <div class="form-group">
              <label>Phone Number</label>
              <input type="text" [(ngModel)]="shop.phoneNumber" name="phoneNumber" class="form-control">
           </div>
           <div class="form-group">
              <label>Address</label>
              <input type="text" [(ngModel)]="shop.address" name="address" class="form-control">
           </div>
        </div>

        <button type="submit" class="btn-save">Save Changes</button>
      </form>
    </div>

    <!-- RIGHT: Logo Upload -->
    <div class="card logo-card">
      <h3>Shop Logo</h3>
      <div class="logo-preview">
        <img [src]="previewImage || 'assets/placeholder-shop.png'" alt="Shop Logo">
      </div>
      <p class="hint">Recommended size: 500x500px</p>
      
      <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;">
      <button class="btn-upload" (click)="fileInput.click()">
        <i class="fas fa-camera"></i> Change Logo
      </button>
    </div>

  </div>
</div>
