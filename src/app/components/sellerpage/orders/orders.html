<div class="container mt-5">
  <h2 class="mb-4">Seller Orders</h2>

  <div *ngIf="loading">Loading orders...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <table class="table table-bordered table-hover" *ngIf="!loading && orders.length">
    <thead class="table-dark">
      <tr>
        <th>Order ID</th>
        <th>Buyer</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order._id }}</td>
        <td>{{ order.buyerName }}</td>
        <td>{{ order.productName }}</td>
        <td>{{ order.quantity }}</td>
        <td>₱{{ order.total | number:'1.0-2' }}</td>
        <td>
          <span
            class="badge"
            [ngClass]="{
              'bg-warning': order.status === 'Pending',
              'bg-success': order.status === 'Complete',
              'bg-danger': order.status === 'Cancelled'
            }"
          >
            {{ order.status }}
          </span>
        </td>
        <td>
          <button
            class="btn btn-sm btn-success me-2"
            [disabled]="order.status !== 'Pending'"
            (click)="changeStatus(order, 'Complete')"
          >
            Complete
          </button>
          <button
            class="btn btn-sm btn-danger"
            [disabled]="order.status !== 'Pending'"
            (click)="changeStatus(order, 'Cancelled')"
          >
            Cancel
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && orders.length === 0">
    No orders yet.
  </div>
</div>
