<div class="profile-container">
  <div class="card profile-card border-0 shadow-lg">
    
    <!-- Success Alert -->
    <div *ngIf="successMessage" class="alert alert-success text-center">
      {{ successMessage }}
    </div>

    <div class="row">
      <!-- LEFT: Profile Picture -->
      <div class="col-md-4 text-center border-end p-4 bg-light rounded-start">
        <h4 class="fw-bold mb-4">Profile Picture</h4>
        
        <div class="avatar-wrapper mb-3">
          <img [src]="previewImage || 'assets/user-avatar-placeholder.png'" class="img-fluid rounded-circle profile-img">
        </div>
        
        <input type="file" #fileInput (change)="onFileSelected($event)" class="d-none">
        <button class="btn btn-outline-primary btn-sm w-100 mb-3" (click)="fileInput.click()">
          <i class="fas fa-camera"></i> Change Photo
        </button>

        <p class="text-muted small">
          {{ user.email }}<br>
          <span class="badge bg-secondary mt-2">Member</span>
        </p>
      </div>

      <!-- RIGHT: Edit Form -->
      <div class="col-md-8 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold mb-0">Edit Profile</h3>
          <button class="btn btn-sm btn-light border" (click)="goBack()">
            <i class="fas fa-arrow-left"></i> Back to Home
          </button>
        </div>

        <form (ngSubmit)="saveProfile()">
          <div class="mb-3">
            <label class="form-label text-muted fw-bold small">Full Name</label>
            <input type="text" class="form-control" [(ngModel)]="user.fullName" name="fullName" placeholder="Enter your full name">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label text-muted fw-bold small">Phone Number</label>
              <input type="text" class="form-control" [(ngModel)]="user.phoneNumber" name="phoneNumber" placeholder="0912 345 6789">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label text-muted fw-bold small">Email (Read-only)</label>
              <input type="email" class="form-control bg-light" [(ngModel)]="user.email" name="email" readonly>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted fw-bold small">Shipping Address</label>
            <textarea class="form-control" rows="2" [(ngModel)]="user.address" name="address" placeholder="House No., Street, City, Province"></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted fw-bold small">Bio (Optional)</label>
            <textarea class="form-control" rows="2" [(ngModel)]="user.bio" name="bio" placeholder="Tell us a bit about yourself..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
            Save Changes
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
