<div class="auth-container">
  <h2>Login</h2>
  <form (ngSubmit)="login()">
    <input type="email" [(ngModel)]="loginData.email" name="email" placeholder="Email" required />
    <input type="password" [(ngModel)]="loginData.password" name="password" placeholder="Password" required />

    <div *ngIf="errorMessage" style="color:red; margin-bottom:10px;">
      {{ errorMessage }}
    </div>

    <button type="submit">Login</button>
  </form>

  <p (click)="reg()">Don't have an account? <a>Register here</a></p>
</div>
